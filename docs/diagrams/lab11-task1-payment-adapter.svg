<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title description">
  <title id="title">Варіант 4 — Підключення платіжного термінала (Adapter)</title>
  <desc id="description">UML-діаграма Adapter: каса працює через PaymentGateway, а адаптери узгоджують інтерфейси двох платіжних терміналів.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#43536b" stroke-width="1.5"/>
    </marker>
    <marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#fff" stroke="#43536b" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #1d2939; }
      .title { font-size: 27px; font-weight: 700; }
      .stereo { font-size: 15px; fill: #475467; font-style: italic; }
      .name { font-size: 20px; font-weight: 700; }
      .member { font-size: 15px; }
      .box { fill: #fff; stroke: #43536b; stroke-width: 1.6; }
      .head { fill: #eaf0f8; }
      .line { fill: none; stroke: #43536b; stroke-width: 1.7; }
      .dash { fill: none; stroke: #43536b; stroke-width: 1.6; stroke-dasharray: 7 5; }
      .label { font-size: 14px; fill: #475467; }
      .note { fill: #fffbe6; stroke: #c9a227; stroke-width: 1.3; }
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#ffffff"/>
  <text class="title" x="800" y="42" text-anchor="middle">Варіант 4 — Підключення платіжного термінала (Adapter)</text>

  <!-- Client, target, result -->
  <g>
    <rect class="box" x="50" y="85" width="410" height="225" rx="5"/>
    <rect class="head" x="50" y="85" width="410" height="64" rx="5"/>
    <text class="stereo" x="255" y="109" text-anchor="middle">«Client»</text>
    <text class="name" x="255" y="135" text-anchor="middle">CinemaCashDesk</text>
    <line class="line" x1="50" y1="149" x2="460" y2="149"/>
    <text class="member" x="70" y="176">- paymentGateway: PaymentGateway</text>
    <line class="line" x1="50" y1="188" x2="460" y2="188"/>
    <text class="member" x="70" y="214">+ CinemaCashDesk(paymentGateway)</text>
    <text class="member" x="70" y="240">+ setPaymentGateway(paymentGateway): void</text>
    <text class="member" x="70" y="266">+ payForTicket(amountInHryvnias): PaymentResult</text>
  </g>
  <g>
    <rect class="box" x="595" y="85" width="410" height="190" rx="5"/>
    <rect class="head" x="595" y="85" width="410" height="64" rx="5"/>
    <text class="stereo" x="800" y="109" text-anchor="middle">«Target»</text>
    <text class="name" x="800" y="135" text-anchor="middle">PaymentGateway</text>
    <line class="line" x1="595" y1="149" x2="1005" y2="149"/>
    <text class="label" x="615" y="176">Інтерфейс платежу, який очікує каса</text>
    <line class="line" x1="595" y1="188" x2="1005" y2="188"/>
    <text class="member" x="615" y="218">+ charge(amountInHryvnias): PaymentResult</text>
  </g>
  <g>
    <rect class="box" x="1140" y="85" width="410" height="255" rx="5"/>
    <rect class="head" x="1140" y="85" width="410" height="64" rx="5"/>
    <text class="stereo" x="1345" y="109" text-anchor="middle">«Result»</text>
    <text class="name" x="1345" y="135" text-anchor="middle">PaymentResult</text>
    <line class="line" x1="1140" y1="149" x2="1550" y2="149"/>
    <text class="member" x="1160" y="176">- successful: boolean</text>
    <text class="member" x="1160" y="199">- message: String</text>
    <line class="line" x1="1140" y1="211" x2="1550" y2="211"/>
    <text class="member" x="1160" y="237">- PaymentResult(successful, message)</text>
    <text class="member" x="1160" y="260">{static} + success(message): PaymentResult</text>
    <text class="member" x="1160" y="283">{static} + declined(reason): PaymentResult</text>
    <text class="member" x="1160" y="306">+ isSuccessful(): boolean</text>
    <text class="member" x="1160" y="329">+ getMessage(): String</text>
  </g>

  <!-- Client to target and adapter realization -->
  <path class="line" d="M460 185 H595" marker-end="url(#arrow)"/>
  <text class="label" x="475" y="174">використовує</text>
  <path class="dash" d="M800 275 V355 H795 V405" marker-end="url(#triangle)"/>
  <path class="dash" d="M800 355 H1335 V405" marker-end="url(#triangle)"/>
  <text class="label" x="810" y="344">реалізує Target</text>

  <!-- Adapters -->
  <g>
    <rect class="box" x="535" y="405" width="520" height="240" rx="5"/>
    <rect class="head" x="535" y="405" width="520" height="64" rx="5"/>
    <text class="stereo" x="795" y="429" text-anchor="middle">«Adapter»</text>
    <text class="name" x="795" y="455" text-anchor="middle">NewBankTerminalAdapter</text>
    <line class="line" x1="535" y1="469" x2="1055" y2="469"/>
    <text class="member" x="555" y="496">- terminal: NewBankTerminal</text>
    <line class="line" x1="535" y1="508" x2="1055" y2="508"/>
    <text class="member" x="555" y="535">+ NewBankTerminalAdapter(terminal)</text>
    <text class="member" x="555" y="561">+ charge(amountInHryvnias): PaymentResult</text>
    <line class="line" x1="535" y1="575" x2="1055" y2="575"/>
    <text class="label" x="555" y="603">Перетворює грн → коп. і код відповіді → результат каси</text>
  </g>
  <g>
    <rect class="box" x="1075" y="405" width="475" height="240" rx="5"/>
    <rect class="head" x="1075" y="405" width="475" height="64" rx="5"/>
    <text class="stereo" x="1312" y="429" text-anchor="middle">«Adapter»</text>
    <text class="name" x="1312" y="455" text-anchor="middle">OtherBankTerminalAdapter</text>
    <line class="line" x1="1075" y1="469" x2="1550" y2="469"/>
    <text class="member" x="1095" y="496">- terminal: OtherBankTerminal</text>
    <line class="line" x1="1075" y1="508" x2="1550" y2="508"/>
    <text class="member" x="1095" y="535">+ OtherBankTerminalAdapter(terminal)</text>
    <text class="member" x="1095" y="561">+ charge(amountInHryvnias): PaymentResult</text>
    <line class="line" x1="1075" y1="575" x2="1550" y2="575"/>
    <text class="label" x="1095" y="603">Перекладає формат другого банку на PaymentGateway</text>
  </g>

  <!-- Adapter to adaptee -->
  <path class="line" d="M795 645 V700" marker-end="url(#arrow)"/>
  <text class="label" x="807" y="681">terminal · 1</text>
  <path class="line" d="M1312 645 V700" marker-end="url(#arrow)"/>
  <text class="label" x="1324" y="681">terminal · 1</text>

  <!-- Adaptees -->
  <g>
    <rect class="box" x="535" y="700" width="520" height="220" rx="5"/>
    <rect class="head" x="535" y="700" width="520" height="64" rx="5"/>
    <text class="stereo" x="795" y="724" text-anchor="middle">«Adaptee»</text>
    <text class="name" x="795" y="750" text-anchor="middle">NewBankTerminal</text>
    <line class="line" x1="535" y1="764" x2="1055" y2="764"/>
    <text class="member" x="555" y="791">- terminalName: String</text>
    <text class="member" x="555" y="814">- availableBalanceInKopiykas: long</text>
    <line class="line" x1="535" y1="826" x2="1055" y2="826"/>
    <text class="member" x="555" y="853">+ NewBankTerminal(terminalName, balance)</text>
    <text class="member" x="555" y="879">+ payInKopiykas(amount): int</text>
  </g>
  <g>
    <rect class="box" x="1075" y="700" width="475" height="220" rx="5"/>
    <rect class="head" x="1075" y="700" width="475" height="64" rx="5"/>
    <text class="stereo" x="1312" y="724" text-anchor="middle">«Adaptee»</text>
    <text class="name" x="1312" y="750" text-anchor="middle">OtherBankTerminal</text>
    <line class="line" x1="1075" y1="764" x2="1550" y2="764"/>
    <text class="member" x="1095" y="791">- availableBalanceInKopiykas: long</text>
    <line class="line" x1="1075" y1="803" x2="1550" y2="803"/>
    <text class="member" x="1095" y="830">+ OtherBankTerminal(balance)</text>
    <text class="member" x="1095" y="856">+ executeTransaction(amount): String</text>
  </g>
  <g>
    <rect class="note" x="50" y="700" width="410" height="150" rx="5"/>
    <text class="member" x="70" y="735">Обидва адаптери реалізують Target.</text>
    <text class="member" x="70" y="765">Каса може замінити платіжний</text>
    <text class="member" x="70" y="791">термінал, не змінюючи власну логіку.</text>
    <text class="member" x="70" y="825">Пунктир: залежність / реалізація.</text>
  </g>

  <!-- Runner -->
  <g>
    <rect class="box" x="50" y="405" width="410" height="220" rx="5"/>
    <rect class="head" x="50" y="405" width="410" height="64" rx="5"/>
    <text class="stereo" x="255" y="429" text-anchor="middle">«Client / runner»</text>
    <text class="name" x="255" y="455" text-anchor="middle">Task1</text>
    <line class="line" x1="50" y1="469" x2="460" y2="469"/>
    <text class="member" x="70" y="496">{static} - TICKET_PRICE: BigDecimal</text>
    <line class="line" x1="50" y1="508" x2="460" y2="508"/>
    <text class="member" x="70" y="535">{static} + main(args): void</text>
    <text class="member" x="70" y="561">{static} - demonstrateTerminalAdapter(): void</text>
  </g>
  <path class="dash" d="M255 405 V335 H255 V310" marker-end="url(#arrow)"/>
  <text class="label" x="270" y="330">створює / налаштовує</text>
</svg>
