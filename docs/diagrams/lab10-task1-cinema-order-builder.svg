<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380" role="img" aria-labelledby="title description">
  <title id="title">Варіант 4 — Замовлення глядача (Builder)</title>
  <desc id="description">UML-діаграма класів Builder для формування замовлень у кінотеатрі.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43536b"/>
    </marker>
    <marker id="diamond" markerWidth="14" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 6 L 7 1 L 13 6 L 7 11 z" fill="#fff" stroke="#43536b" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #1d2939; }
      .title { font-size: 30px; font-weight: 700; }
      .box { fill: #fff; stroke: #344054; stroke-width: 2; rx: 8; }
      .head { fill: #eaf1fb; }
      .stereo { font-size: 16px; font-style: italic; fill: #475467; }
      .name { font-size: 21px; font-weight: 700; }
      .member { font-size: 15px; }
      .divider { stroke: #98a2b3; stroke-width: 1.2; }
      .link { fill: none; stroke: #43536b; stroke-width: 2; }
      .dashed { stroke-dasharray: 8 6; }
      .label { font-size: 14px; fill: #344054; }
      .note { fill: #fff8db; stroke: #d6a53c; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1600" height="1380" fill="#f8fafc"/>
  <text class="title" x="800" y="46" text-anchor="middle">Варіант 4 — Замовлення глядача (Builder)</text>

  <!-- Associations and dependencies -->
  <path class="link dashed" d="M 430 285 L 520 285 L 520 470 L 600 470" marker-end="url(#arrow)"/>
  <text class="label" x="439" y="271">створює довільне</text>
  <path class="link dashed" d="M 430 340 L 490 340 L 490 140 L 590 140" marker-end="url(#arrow)"/>
  <text class="label" x="448" y="326">типові замовлення</text>
  <path class="link dashed" d="M 430 395 L 470 395 L 470 830 L 320 830" marker-end="url(#arrow)"/>
  <text class="label" x="438" y="421">створює сеанс</text>

  <path class="link dashed" d="M 830 330 L 830 390 L 755 390 L 755 410" marker-end="url(#arrow)"/>
  <text class="label" x="842" y="374">керує кроками</text>
  <path class="link dashed" d="M 600 790 L 560 790 L 560 850 L 520 850" marker-end="url(#arrow)"/>
  <text class="label" x="402" y="783">встановлює сеанс</text>

  <path class="link dashed" d="M 960 825 L 960 910 L 1090 910 L 1090 940" marker-end="url(#arrow)"/>
  <text class="label" x="975" y="899">&lt;&lt;creates&gt;&gt;</text>
  <path class="link" d="M 760 980 L 700 980 L 700 940 L 520 940" marker-end="url(#arrow)"/>
  <text class="label" x="546" y="928">0..* замовлень → 1 сеанс</text>

  <!-- Task1 -->
  <g>
    <rect class="box" x="40" y="90" width="390" height="390"/>
    <path class="head" d="M48 90 H422 Q430 90 430 98 V160 H40 V98 Q40 90 48 90Z"/>
    <text class="stereo" x="235" y="117" text-anchor="middle">&lt;&lt;Client&gt;&gt;</text>
    <text class="name" x="235" y="145" text-anchor="middle">Task1</text>
    <line class="divider" x1="40" y1="160" x2="430" y2="160"/>
    <text class="member" x="58" y="185">− {static} minute: int</text>
    <text class="member" x="58" y="208">− Task1()</text>
    <line class="divider" x1="40" y1="222" x2="430" y2="222"/>
    <text class="member" x="58" y="247">+ {static} main(args: String[]): void</text>
    <text class="member" x="58" y="272">− {static} demonstrateCustomOrder(session): void</text>
    <text class="member" x="58" y="297">− {static} demonstrateComboForTwo(session): void</text>
    <text class="member" x="58" y="322">− {static} demonstrateOrderWithoutSeats(session): void</text>
    <text class="member" x="58" y="347">− {static} log(source: String, event: String): void</text>
    <text class="label" x="58" y="404">Демонструє сценарії та виводить журнал.</text>
  </g>

  <!-- Director -->
  <g>
    <rect class="box" x="590" y="90" width="500" height="240"/>
    <path class="head" d="M598 90 H1082 Q1090 90 1090 98 V160 H590 V98 Q590 90 598 90Z"/>
    <text class="stereo" x="840" y="117" text-anchor="middle">&lt;&lt;Director&gt;&gt;</text>
    <text class="name" x="840" y="145" text-anchor="middle">CinemaOrderDirector</text>
    <line class="divider" x1="590" y1="160" x2="1090" y2="160"/>
    <line class="divider" x1="590" y1="160" x2="1090" y2="160"/>
    <text class="member" x="610" y="188">+ createComboForTwo(session): CinemaOrder</text>
    <text class="member" x="610" y="215">+ createFamilyEvening(session): CinemaOrder</text>
    <text class="member" x="610" y="242">− buildTypicalOrder(name, session, seats,</text>
    <text class="member" x="630" y="264">popcornPortions, drinkCount, glasses3dCount): CinemaOrder</text>
    <text class="label" x="610" y="304">Описує типові замовлення в одному місці.</text>
  </g>

  <!-- Builder -->
  <g>
    <rect class="box" x="600" y="410" width="720" height="415"/>
    <path class="head" d="M608 410 H1312 Q1320 410 1320 418 V480 H600 V418 Q600 410 608 410Z"/>
    <text class="stereo" x="960" y="437" text-anchor="middle">&lt;&lt;Builder&gt;&gt;</text>
    <text class="name" x="960" y="465" text-anchor="middle">CinemaOrderBuilder</text>
    <line class="divider" x1="600" y1="480" x2="1320" y2="480"/>
    <text class="member" x="620" y="504">− orderName: String = "Звичайне"</text>
    <text class="member" x="620" y="526">− session: MovieSession</text>
    <text class="member" x="620" y="548">− seats: List&lt;String&gt;</text>
    <text class="member" x="620" y="570">− popcornPortions: int</text>
    <text class="member" x="620" y="592">− drinkCount: int</text>
    <text class="member" x="620" y="614">− glasses3dCount: int</text>
    <text class="member" x="970" y="504">− promoCode: String</text>
    <text class="member" x="970" y="526">− vipService: boolean</text>
    <line class="divider" x1="600" y1="630" x2="1320" y2="630"/>
    <text class="member" x="620" y="654">+ setOrderName(name): CinemaOrderBuilder</text>
    <text class="member" x="620" y="676">+ setSession(session): CinemaOrderBuilder</text>
    <text class="member" x="620" y="698">+ addSeat(seat): CinemaOrderBuilder</text>
    <text class="member" x="620" y="720">+ addPopcorn(n): CinemaOrderBuilder</text>
    <text class="member" x="620" y="742">+ addDrinks(n): CinemaOrderBuilder</text>
    <text class="member" x="970" y="654">+ add3dGlasses(n): CinemaOrderBuilder</text>
    <text class="member" x="970" y="676">+ applyPromoCode(code): CinemaOrderBuilder</text>
    <text class="member" x="970" y="698">+ enableVipService(): CinemaOrderBuilder</text>
    <text class="member" x="970" y="720">+ build(): CinemaOrder</text>
    <text class="member" x="970" y="742">− {static} requireText(...): String</text>
    <text class="member" x="970" y="764">− {static} requirePositive(...): int</text>
    <text class="label" x="620" y="798">build() перевіряє сеанс і наявність хоча б одного місця.</text>
  </g>

  <!-- Product -->
  <g>
    <rect class="box" x="760" y="940" width="660" height="300"/>
    <path class="head" d="M768 940 H1412 Q1420 940 1420 948 V1010 H760 V948 Q760 940 768 940Z"/>
    <text class="stereo" x="1090" y="967" text-anchor="middle">&lt;&lt;Product&gt;&gt;</text>
    <text class="name" x="1090" y="995" text-anchor="middle">CinemaOrder</text>
    <line class="divider" x1="760" y1="1010" x2="1420" y2="1010"/>
    <text class="member" x="780" y="1035">− orderName: String {readOnly}</text>
    <text class="member" x="780" y="1058">− session: MovieSession {readOnly}</text>
    <text class="member" x="780" y="1081">− seats: List&lt;String&gt; {readOnly}</text>
    <text class="member" x="780" y="1104">− popcornPortions: int {readOnly}</text>
    <text class="member" x="1100" y="1035">− drinkCount: int {readOnly}</text>
    <text class="member" x="1100" y="1058">− glasses3dCount: int {readOnly}</text>
    <text class="member" x="1100" y="1081">− promoCode: String {readOnly}</text>
    <text class="member" x="1100" y="1104">− vipService: boolean {readOnly}</text>
    <line class="divider" x1="760" y1="1122" x2="1420" y2="1122"/>
    <text class="member" x="780" y="1147">~ CinemaOrder(builder: CinemaOrderBuilder)</text>
    <text class="member" x="780" y="1173">+ toString(): String</text>
    <text class="label" x="780" y="1210">Незмінне замовлення після успішного build().</text>
  </g>

  <!-- Session value -->
  <g>
    <rect class="box" x="40" y="830" width="480" height="220"/>
    <path class="head" d="M48 830 H512 Q520 830 520 838 V900 H40 V838 Q40 830 48 830Z"/>
    <text class="stereo" x="280" y="857" text-anchor="middle">&lt;&lt;Domain value&gt;&gt;</text>
    <text class="name" x="280" y="885" text-anchor="middle">MovieSession</text>
    <line class="divider" x1="40" y1="900" x2="520" y2="900"/>
    <text class="member" x="60" y="925">+ movieTitle: String {readOnly}</text>
    <text class="member" x="60" y="948">+ startsAt: LocalDateTime {readOnly}</text>
    <line class="divider" x1="40" y1="962" x2="520" y2="962"/>
    <text class="member" x="60" y="987">+ MovieSession(movieTitle, startsAt)</text>
    <text class="member" x="60" y="1012">+ toString(): String</text>
  </g>

  <rect class="note" x="40" y="555" width="390" height="110" rx="6"/>
  <text class="label" x="58" y="584">UML-зв’язки:</text>
  <text class="label" x="58" y="608">пунктирна стрілка — залежність / створення;</text>
  <text class="label" x="58" y="632">суцільна стрілка — асоціація з кратністю.</text>
</svg>
