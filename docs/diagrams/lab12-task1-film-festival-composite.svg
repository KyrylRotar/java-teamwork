<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title description">
  <title id="title">Діаграма класів Composite — програма кінофестивалю</title>
  <desc id="description">UML-діаграма компонентів програми фестивалю, фільмів, складених груп, раннера та журналу подій.</desc>
  <defs>
    <marker id="inheritance" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L12 7 L1 13 Z" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="composition" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 7 L7 1 L13 7 L7 13 Z" fill="#334155" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="dependency" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .box { fill: #fff; stroke: #334155; stroke-width: 2; rx: 8; }
      .head { fill: #e8efff; }
      .interface-head { fill: #dbeafe; }
      .group-head { fill: #ede9fe; }
      .client-head { fill: #dcfce7; }
      .type { font-size: 13px; font-style: italic; fill: #475569; }
      .name { font-size: 19px; font-weight: 700; }
      .member { font-size: 15px; }
      .divider { stroke: #94a3b8; stroke-width: 1; }
      .link { fill: none; stroke: #334155; stroke-width: 2; }
      .realization { fill: none; stroke: #334155; stroke-width: 2; stroke-dasharray: 8 6; }
      .dependency-line { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; }
      .note { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
      .note-text { font-size: 15px; fill: #78350f; }
      .label { font-size: 14px; fill: #334155; }
    </style>
  </defs>

  <rect width="1440" height="1120" fill="#f8fafc"/>
  <text class="title" x="720" y="40" text-anchor="middle">Програма кінофестивалю — Composite</text>
  <text class="subtitle" x="720" y="66" text-anchor="middle">Варіант 4 · кінотеатр «Кадр» · діаграма класів</text>

  <!-- ProgramGroup contains components and is the parent of concrete groups. -->
  <path class="link" d="M930 390 L980 390 L980 150 L940 150" marker-start="url(#composition)"/>
  <text class="label" x="944" y="380">1</text>
  <text class="label" x="925" y="140">0..*</text>
  <path class="link" d="M145 800 L145 765 L1295 765 L1295 800"/>
  <path class="link" d="M528 800 L528 765"/>
  <path class="link" d="M912 800 L912 765"/>
  <path class="link" d="M720 765 L720 660" marker-end="url(#inheritance)"/>

  <!-- Realization links to the Component interface. -->
  <path class="realization" d="M250 360 L250 260 L580 260 L580 220" marker-end="url(#inheritance)"/>
  <path class="realization" d="M720 360 L720 220" marker-end="url(#inheritance)"/>

  <g>
    <rect class="box" x="500" y="95" width="440" height="125"/>
    <path class="interface-head" d="M508 95 H932 Q940 95 940 103 V151 H500 V103 Q500 95 508 95 Z"/>
    <text class="type" x="720" y="117" text-anchor="middle">«Component»</text>
    <text class="name" x="720" y="142" text-anchor="middle">ProgramComponent</text>
    <line class="divider" x1="500" y1="151" x2="940" y2="151"/>
    <text class="member" x="520" y="175">+ getName() : String</text>
    <text class="member" x="520" y="197">+ getDurationMinutes() : int</text>
    <text class="member" x="730" y="175">+ getFilmCount() : int</text>
    <text class="member" x="730" y="197">+ printTree(indentation) : void</text>
  </g>

  <g>
    <rect class="box" x="60" y="360" width="380" height="230"/>
    <path class="head" d="M68 360 H432 Q440 360 440 368 V416 H60 V368 Q60 360 68 360 Z"/>
    <text class="type" x="250" y="383" text-anchor="middle">«Leaf»</text>
    <text class="name" x="250" y="407" text-anchor="middle">Film</text>
    <line class="divider" x1="60" y1="416" x2="440" y2="416"/>
    <text class="member" x="82" y="443">- title : String</text>
    <text class="member" x="82" y="466">- durationMinutes : int</text>
    <line class="divider" x1="60" y1="480" x2="440" y2="480"/>
    <text class="member" x="82" y="507">+ Film(title, durationMinutes)</text>
    <text class="member" x="82" y="530">+ getDurationMinutes() : int</text>
    <text class="member" x="82" y="553">+ getFilmCount() : int</text>
    <text class="member" x="82" y="576">+ printTree(indentation) : void</text>
  </g>

  <g>
    <rect class="box" x="510" y="360" width="420" height="300"/>
    <path class="group-head" d="M518 360 H922 Q930 360 930 368 V416 H510 V368 Q510 360 518 360 Z"/>
    <text class="type" x="720" y="383" text-anchor="middle">«Composite»</text>
    <text class="name" x="720" y="407" text-anchor="middle">ProgramGroup</text>
    <line class="divider" x1="510" y1="416" x2="930" y2="416"/>
    <text class="member" x="532" y="443">- name : String</text>
    <text class="member" x="532" y="466">- components : List&lt;ProgramComponent&gt;</text>
    <line class="divider" x1="510" y1="480" x2="930" y2="480"/>
    <text class="member" x="532" y="507"># ProgramGroup(name : String)</text>
    <text class="member" x="532" y="530">+ add(component : ProgramComponent) : void</text>
    <text class="member" x="532" y="553">+ getDurationMinutes() : int</text>
    <text class="member" x="532" y="576">+ getFilmCount() : int</text>
    <text class="member" x="532" y="599">+ printTree(indentation) : void</text>
    <text class="member" x="532" y="636">+ getName() : String</text>
  </g>

  <g>
    <rect class="note" x="1010" y="385" width="350" height="150" rx="8"/>
    <text class="note-text" x="1032" y="416">Тривалість і кількість фільмів</text>
    <text class="note-text" x="1032" y="443">рекурсивно обчислюються через</text>
    <text class="note-text" x="1032" y="470">спільний інтерфейс для будь-якої</text>
    <text class="note-text" x="1032" y="497">глибини вкладеності.</text>
  </g>

  <g>
    <rect class="box" x="25" y="800" width="240" height="105"/>
    <path class="head" d="M33 800 H257 Q265 800 265 808 V854 H25 V808 Q25 800 33 800 Z"/>
    <text class="type" x="145" y="822" text-anchor="middle">«ConcreteComposite»</text>
    <text class="name" x="145" y="846" text-anchor="middle">FilmFestival</text>
    <line class="divider" x1="25" y1="854" x2="265" y2="854"/>
    <text class="member" x="45" y="881">+ FilmFestival(name)</text>
  </g>
  <g>
    <rect class="box" x="408" y="800" width="240" height="105"/>
    <path class="head" d="M416 800 H640 Q648 800 648 808 V854 H408 V808 Q408 800 416 800 Z"/>
    <text class="type" x="528" y="822" text-anchor="middle">«ConcreteComposite»</text>
    <text class="name" x="528" y="846" text-anchor="middle">ThematicBlock</text>
    <line class="divider" x1="408" y1="854" x2="648" y2="854"/>
    <text class="member" x="428" y="881">+ ThematicBlock(name)</text>
  </g>
  <g>
    <rect class="box" x="792" y="800" width="240" height="105"/>
    <path class="head" d="M800 800 H1024 Q1032 800 1032 808 V854 H792 V808 Q792 800 800 800 Z"/>
    <text class="type" x="912" y="822" text-anchor="middle">«ConcreteComposite»</text>
    <text class="name" x="912" y="846" text-anchor="middle">Screening</text>
    <line class="divider" x1="792" y1="854" x2="1032" y2="854"/>
    <text class="member" x="812" y="881">+ Screening(name)</text>
  </g>
  <g>
    <rect class="box" x="1175" y="800" width="240" height="105"/>
    <path class="head" d="M1183 800 H1407 Q1415 800 1415 808 V854 H1175 V808 Q1175 800 1183 800 Z"/>
    <text class="type" x="1295" y="822" text-anchor="middle">«ConcreteComposite»</text>
    <text class="name" x="1295" y="846" text-anchor="middle">ShortFilmCollection</text>
    <line class="divider" x1="1175" y1="854" x2="1415" y2="854"/>
    <text class="member" x="1195" y="881">+ ShortFilmCollection(name)</text>
  </g>

  <g>
    <rect class="box" x="355" y="960" width="350" height="120"/>
    <path class="client-head" d="M363 960 H697 Q705 960 705 968 V1013 H355 V968 Q355 960 363 960 Z"/>
    <text class="type" x="530" y="982" text-anchor="middle">«Client»</text>
    <text class="name" x="530" y="1006" text-anchor="middle">Task1Runner</text>
    <line class="divider" x1="355" y1="1013" x2="705" y2="1013"/>
    <text class="member" x="375" y="1040">+ main(args : String[]) : void</text>
    <text class="member" x="375" y="1064">+ run() : void</text>
  </g>
  <g>
    <rect class="box" x="900" y="960" width="350" height="120"/>
    <path class="head" d="M908 960 H1242 Q1250 960 1250 968 V1013 H900 V968 Q900 960 908 960 Z"/>
    <text class="name" x="1075" y="997" text-anchor="middle">EventLogger</text>
    <line class="divider" x1="900" y1="1013" x2="1250" y2="1013"/>
    <text class="member" x="920" y="1045">+ log(source, message) : void</text>
    <text class="label" x="920" y="1067">{static}</text>
  </g>

  <path class="dependency-line" d="M930 590 L970 590 L970 960" marker-end="url(#dependency)"/>
  <path class="dependency-line" d="M440 560 L465 560 L465 930 L1075 930 L1075 960" marker-end="url(#dependency)"/>
  <text class="label" x="975" y="923">logs</text>
</svg>
